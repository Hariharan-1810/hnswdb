[build-system]
requires = ["setuptools>=45", "wheel", "cffi>=1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hnswdb"
version = "0.1.0"
description = "A high-performance local HNSW vector database for Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hariharan Thangaraj", email = "hariharan10449@gmail.com"}
]
keywords = [
    "hnsw",
    "vector",
    "database",
    "embeddings",
    "nearest-neighbor",
    "similarity-search",
    "machine-learning",
    "ai",
    "local-storage"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "cffi>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/Hariharan-1810/hnswdb"
Documentation = "https://github.com/Hariharan-1810/hnswdb/blob/main/DOCUMENTATION.md"
Repository = "https://github.com/Hariharan-1810/hnswdb"
Issues = "https://github.com/Hariharan-1810/hnswdb/issues"

[tool.setuptools]
packages = ["hnswdb", "hnswdb.core"]
include-package-data = true

[tool.setuptools.package-data]
"hnswdb.core" = ["*.c", "*.h"]
