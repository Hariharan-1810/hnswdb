name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build/test dependencies
        run: python -m pip install --upgrade pip setuptools wheel cffi pytest

      - name: Compile C extension in place
        run: python hnswdb/build_cffi.py

      - name: Run tests
        run: python -m pytest tests -v

      - name: Run example
        working-directory: examples
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python law_search.py

  package:
    name: Install as package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip install .
        run: python -m pip install .

      - name: Smoke test installed package
        working-directory: /tmp
        run: |
          python -c "
          import hnswdb
          db = hnswdb.HNSWDatabase().start()
          db.store([[1.0, 0.0], [0.0, 1.0], [0.9, 0.1]])
          res = db.find_ids([1.0, 0.0], k=2)
          assert [i for i, _ in res] == [0, 2], res
          print('OK', hnswdb.__version__, res)
          "
